name: Validate corpus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-citation-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Tesserae citation format
        run: python utils/validate_tess.py
